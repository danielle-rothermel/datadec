# Default experiment and evidence selections for DataDecide.
# Paper selections remain in the separate claim inventory.
sweep_metric_group = "all"
default_related_tables = ["curves.csv", "proxy_comparisons.parquet"]


[run]
data_dir = "data"
output_dir = "outputs/repro/ranking"
claim_inventory = "configs/repro_claims/magnusson2025-datadecide.toml"
paper_dir = "docs/papers/2504.11393v2"
matched_compute_tolerance = 0.05

[target]
size = "1B"
step = 69369
metric = "primary_metric"
seeds = ["default", "large aux 2", "large aux 3"]

[predictors]
default_seeds = ["default", "small aux 2", "small aux 3"]

[predictors.seeds_by_size]
1B = ["default", "large aux 2", "large aux 3"]

[aggregation]
benchmark_group = "benchmarks"
macro_task = "olmes"
subject_task = "mmlu"
subject_prefix = "mmlu_"
subject_count = 57

[task_groups]
benchmarks = [
  "arc_challenge",
  "arc_easy",
  "boolq",
  "csqa",
  "hellaswag",
  "mmlu",
  "openbookqa",
  "piqa",
  "socialiqa",
  "winogrande",
]
other_tasks = ["boolq", "csqa", "openbookqa", "piqa", "socialiqa", "winogrande"]

[metric_groups]
all = [
  "primary_metric",
  "acc_raw",
  "acc_per_token",
  "acc_per_char",
  "correct_prob",
  "correct_prob_per_token",
  "correct_prob_per_char",
  "total_prob",
  "total_prob_per_token",
  "total_prob_per_char",
  "norm_correct_prob",
  "norm_correct_prob_per_token",
  "norm_correct_prob_per_char",
  "margin",
  "margin_per_token",
  "margin_per_char",
]
primary = ["primary_metric"]
character_proxies = [
  "correct_prob_per_char",
  "total_prob_per_char",
  "norm_correct_prob_per_char",
  "margin_per_char",
]
likelihood_proxies = [
  "correct_prob",
  "correct_prob_per_token",
  "correct_prob_per_char",
  "total_prob",
  "total_prob_per_token",
  "total_prob_per_char",
  "norm_correct_prob",
  "norm_correct_prob_per_token",
  "norm_correct_prob_per_char",
  "margin",
  "margin_per_token",
  "margin_per_char",
]

