[project]
name = "datadec"
version = "0.1.1"
description = "A library and CLI to manage the DataDecide dataset lifecycle."
readme = "README.md"
authors = [
    { name = "Danielle Rothermel", email = "danielle.rothermel@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "dr-ds>=0.1.2",
    "dr-hf>=0.1.2",
    "dr-providers[local]>=0.3.5",
    "duckdb>=1.5.5",
    "fsspec>=2026.3.0",
    "huggingface-hub>=1.3.5",
    "numpy>=2.0.2",
    "orjson>=3.11.2",
    "pandas>=2.3.1",
    "pyarrow>=21.0.0",
    "pydantic>=2.11",
    "rich>=14.0.0",
    "srsly>=2.5.1",
    "typer>=0.20.0",
]

[project.scripts]
datadec = "datadec.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/datadec", "src/eval", "src/repro"]

[tool.hatch.build.targets.wheel.force-include]
"configs/repro_evaluations/magnusson2025-datadecide.toml" = "repro/configs/repro_evaluations/magnusson2025-datadecide.toml"
"configs/catalog.toml" = "datadec/configs/catalog.toml"
"configs/checkpoints.toml" = "datadec/configs/checkpoints.toml"
"configs/olmes.toml" = "datadec/configs/olmes.toml"
"configs/publishing.toml" = "datadec/configs/publishing.toml"
"configs/published_results.toml" = "datadec/configs/published_results.toml"
"configs/scaling_law.toml" = "datadec/configs/scaling_law.toml"
"configs/sources.toml" = "datadec/configs/sources.toml"

[tool.ruff]
include = ["src/**/*.py", "scripts/**/*.py", "tests/**/*.py"]
line-length = 88
cache-dir = ".ruff_cache"
exclude = ["outputs/*", "notebooks/*"]

[tool.pytest.ini_options]
addopts = "-m 'not hub'"
markers = [
    "hub: needs network access to the Hugging Face Hub (opt in with -m hub)",
]

[tool.uv.sources]
datadec = { workspace = true }

[dependency-groups]
dev = [
    "datadec",
    "pytest>=8.4.1",
    "pytest-postgresql>=7.0.0",
    "ty",
]
